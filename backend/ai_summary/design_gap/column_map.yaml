# Design-gap column map
# Edit `columns`, `required_classified`, and `required_text` per check.
# Field names are control_forms DB columns (snake_case), plus:
#   assertions.*  → ALL fields from that control's assertions section (racm_field_values)
#   assertions.any → synthetic gate helper (any non-empty assertion value)
#
# Gate rules (per check, before OpenRouter):
#   required_classified: value must be non-empty AND in allowed list (case-insensitive)
#   required_text: value must be non-empty (trim); empty → insufficient_data, skip AI for that check
#
# Shared classified values (single source — also used by Unclassified Controls page):
#   backend/config/control_classification_allowed_values.json
#   Use "$shared" under required_classified to pull from that file:
#     nature_of_control / control_type_ma / control_type_fo / key_control
#   Use "$shared_non_key" for key_control when the check applies only to No (non-key)

settings:
  model: "openai/gpt-4.1-mini"
  # Cost knobs — see COSTING.txt
  temperature: 0
  max_tokens: 2500
  # Truncate long free-text fields before sending to the model (chars)
  max_field_chars: 1200
  openrouter_base_url: "https://openrouter.ai/api/v1"
  # Optional HTTP referer / title headers for OpenRouter rankings
  http_referer: ""
  app_title: "IFC Design Gap Prototype"
  # Always included in every check payload (merged ahead of each check's columns)
  default_columns:
    - business_process

# Design-gap-only allowed values (not shared with the website UI).
# Use "$allowed" under required_classified to pull aliases from this section.
# Structured entries support letter abbreviations + definitions for the AI payload.
allowed_values:
  risk_heat:
    High:
      aliases: ["High", "H"]
      definition: "High - elevated risk heat / severity"
    Medium:
      aliases: ["Medium", "M", "Med"]
      definition: "Medium - moderate risk heat / severity"
    Low:
      aliases: ["Low", "L"]
      definition: "Low - lower risk heat / severity"

checks:
  - id: risk_control_alignment
    statement: "Whether risks and controls are adequately aligned with each other"
    columns:
      - risk_description
      - control_objective
      - standard_control_description
      - sub_process
    required_classified: {}
    required_text:
      - risk_description
      - standard_control_description

  # This will be covered in Risk analysis, No need to add this in design gap
  # - id: business_cycle_risk_coverage
  #   statement: "Whether adequate risks are identified and covered across the entire business cycle"
  #   # Note: true cycle coverage is portfolio-level; per-control we judge local coverage signals only.
  #   columns:
  #     - area
  #     - sub_process
  #     - risk_description
  #     - control_objective
  #   required_classified: {}
  #   required_text:
  #     - risk_description
  #     - sub_process

  - id: assertion_allocation
    statement: "Whether appropriate financial statement assertions are allocated to each risk"
    # assertions.* expands at runtime to every field in this control's assertions section
    # (1 combined column or many separate columns — whatever the RACM template has).
    # Values are free text; no Yes/No validation.
    columns:
      - risk_description
      - assertions.*
    required_classified: {}
    # Skip AI only when the assertions section has no non-empty values at all.
    required_text:
      - risk_description
      - assertions.any

  # - id: romm
  #   statement: "Whether the risk constitutes a Risk of Material Misstatement (RoMM)"
  #   # No dedicated RoMM column on control_forms — using risk_heat as a stand-in.
  #   # Remap `columns` / `required_classified` if you store RoMM elsewhere (custom field).
  #   columns:
  #     - risk_description
  #     - risk_heat
  #     - whether_fraud_risks_exist
  #     - key_control
  #   required_classified:
  #     risk_heat: "$allowed"
  #   required_text:
  #     - risk_description

  - id: control_objective_adequacy
    statement: "Whether the control objective and control description are adequate to mitigate the associated risk"
    columns:
      - risk_description
      - control_objective
      - standard_control_description
    required_classified: {}
    required_text:
      - risk_description
      - control_objective
      - standard_control_description

  # - id: preventive_detective_classification
  #   statement: "Whether the control classification (Preventive/Detective) is appropriate"
  #   columns:
  #     - nature_of_control
  #     - risk_description
  #     - standard_control_description
  #     - control_objective
  #   required_classified:
  #     nature_of_control: "$shared"
  #   required_text:
  #     - risk_description
  #     - standard_control_description

  # - id: nature_of_control_classification
  #   statement: "Whether the nature of the control is appropriately classified"
  #   # In this schema nature_of_control == Preventive/Detective (same field as above).
  #   # Keep separate so statement.txt stays 1:1; merge in YAML later if redundant.
  #   columns:
  #     - nature_of_control
  #     - risk_description
  #     - standard_control_description
  #   required_classified:
  #     nature_of_control: "$shared"
  #   required_text:
  #     - risk_description
  #     - standard_control_description

  # - id: manual_automated_and_automation
  #   statement: "Whether the control is Manual, Automated, or System-driven, and identify opportunities for automation"
  #   columns:
  #     - control_type_ma
  #     - application_name
  #     - standard_control_description
  #     - control_objective
  #     - ipe_reference
  #   required_classified:
  #     control_type_ma: "$shared"
  #   required_text:
  #     - standard_control_description

  - id: fraud_risk
    statement: "Whether any fraud risk exists in relation to the identified risk/process"
    columns:
      - whether_fraud_risks_exist
      - risk_description
      - sub_process
      - standard_control_description
    required_classified: {}
    required_text:
      - whether_fraud_risks_exist
      - risk_description

  - id: key_control_classification
    statement: "Whether the control should be classified as a Key Control"
    # Only for non-key controls (key_control = No from shared config).
    # Key controls (Yes) skip this check — not sent to OpenRouter.
    columns:
      - key_control
      - risk_description
      - risk_heat
      - control_objective
      - standard_control_description
    required_classified:
      key_control: "$shared_non_key"
    required_text:
      - risk_description
      - standard_control_description
